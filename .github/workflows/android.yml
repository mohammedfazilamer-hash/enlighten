name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        run: ./gradlew testQaUnitTest lintRelease assembleQa assembleQaAndroidTest bundleRelease

      - name: Upload QA packages and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/qa/*.apk
            app/build/outputs/apk/androidTest/qa/*.apk
            app/build/reports/lint-results-release.html
            app/build/reports/tests/
